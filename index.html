<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6b3f20">

    <title>Jyoti Gruh Udhyog | Product Menu</title>

    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="header">

    <img src="logo.webp" class="logo" alt="Jyoti Gruh Udhyog">

    <h1>JYOTI GRUH UDHYOG</h1>

    <p class="tagline">
        Taste of Home in Every Bite
    </p>

    <p class="location">
        📍 Rajkot
    </p>

    <div class="contact">

        <a href="tel:+919712149344" class="call-btn">
            📞 Call
        </a>

        <a href="https://wa.me/919712149344" class="whatsapp-btn">
            WhatsApp
        </a>

    </div>

</header>

<section class="menu-header">

    <h2 class="product-heading">
        PRODUCT LIST (<span id="productCount">0</span>)
    </h2>

    <div class="search-section">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search Products...">

    </div>

</section>

<main id="menuContainer">

</main>

<!-- Sticky Cart -->

<div id="cartBar" class="cart-bar">

    <div>

        <strong>
            🛒 Cart (<span id="cartItems">0</span>)
        </strong>

        <br>

        <span id="cartTotal">
            ₹0
        </span>

    </div>

    <button id="orderBtn">
        Order on WhatsApp
    </button>

</div>

<footer>

    © 2026 Jyoti Gruh Udhyog

</footer>

<script src="api.js"></script>

</body>

</html>
