<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6B3F20">
    <meta name="description" content="Jyoti Gruh Udhyog - Premium Homemade Products">

    <title>Jyoti Gruh Udhyog | Product Menu</title>

    <link rel="icon" href="favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=4">

</head>

<body>

<header class="header">

    <img src="logo.webp" alt="Jyoti Gruh Udhyog" class="logo">

    <h1>JYOTI GRUH UDHYOG</h1>

    <p class="tagline">
        Taste of Home in Every Bite
    </p>

    <p class="location">
        📍 Rajkot, Gujarat
    </p>

    <div class="contact">

        <a href="tel:+919712149344" class="call-btn">
            📞 Call Now
        </a>

        <a href="https://wa.me/919712149344" class="whatsapp-btn" target="_blank">
            💬 WhatsApp
        </a>

    </div>

</header>

<section class="menu-header">

    <h2 class="product-heading">
        PRODUCT LIST
        (<span id="productCount">0</span>)
    </h2>

    <input
        type="search"
        id="searchInput"
        placeholder="🔍 Search Products..."
        autocomplete="off"
        spellcheck="false">

</section>

<main id="menuContainer">

    <div id="loader" class="loader">

        <div class="spinner"></div>

        <p>Loading Products...</p>

    </div>

</main>

<div id="cartBar" class="cart-bar">

    <div class="cart-details">

        <strong>
            🛒 Cart (<span id="cartItems">0</span>)
        </strong>

        <div id="cartTotal">
            ₹0
        </div>

    </div>

    <button id="orderBtn">
        🟢 Order on WhatsApp
    </button>

</div>

<footer>

    <p>© 2026 Jyoti Gruh Udhyog</p>

</footer>

<script src="api.js?v=4"></script>

</body>

</html>
